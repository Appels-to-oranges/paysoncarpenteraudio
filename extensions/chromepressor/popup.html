<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Audio Compressor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
    <style>
      body { min-width: 320px; padding: 0.0rem; }
      .card { border: none; box-shadow: 0 0.25rem 0.5rem rgba(0,0,0,.08); background: lightgrey}
      .card-header { color: black; font-weight: 600; background:lightgrey; border-bottom: 1px solid #000000; }
      .card-header .popup-header-inner { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; width: 100%; }
      .popup-title { display: block; }
      .popup-header-icon { width: 64px; height: 64px; flex-shrink: 0; object-fit: contain; }
      .popup-title {
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 1.75rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1.1;
        -webkit-font-smoothing: antialiased;
      }
      .form-group { margin-bottom: .1rem; }
      .form-group label { font-weight: 500; margin-bottom: 0.1rem; display: block; }
      .range-row { display: flex; align-items: center; gap: 0.50rem; }
      .range-row input[type="range"] { flex: 1; }
      .range-value { min-width: 3.5rem; font-size: 0.875rem; color: #363636; text-align: right; font-variant-numeric: tabular-nums; }
      input[type="range"] { accent-color: #363636; }
      .btn-apply { font-weight: 600; background: #363636; border-color: #363636;}
      .btn-apply:hover,.btn-apply:active,.btn-apply:focus,.btn-apply:visited {background: #000000; border-color: #394047;}
      .btn-apply:click {background: #000000; border-color: #363636;}
      /* we need to remove the default blue background after clicked */
      .btn-apply:active,
      .btn-apply:focus,
      .btn-apply:visited {
        background: #000000 !important;
        border-color: #394047 !important;
        box-shadow: none !important;
        color: #fff !important;
      }
      .popup-view { display: none; }
      .popup-view.active { display: block; }
      .btn-settings { font-size: 0.875rem; }
      .visualizer-chart-wrap { background: #d3d3d3; padding: 0; }
      .visualizer-chart-wrap canvas { display: block; width: 100%; height: auto; }
      .visualizer-meters { margin-bottom: 0.4rem; }
      .visualizer-meters .viz-meter-row { display: flex; align-items: center; gap: 0.5rem; padding: 0.2rem 0; }
      .visualizer-meters .viz-meter-row label { font-size: 0.7rem; font-weight: 500; margin-bottom: 0; display: flex; align-items: center; gap: 0.25rem; color: #363636; min-width: 3.5rem; }
      .visualizer-meters .viz-meter-row input[type="checkbox"] { margin: 0; width: 0.85rem; height: 0.85rem; }
      .visualizer-meters .viz-readout { font-size: 0.7rem; font-variant-numeric: tabular-nums; color: #363636; letter-spacing: 0.02em; margin-right: 1rem; }
      .visualizer-form .form-group { margin-bottom: 0.25rem; }
      .visualizer-form .form-group label { font-size: 0.8rem; margin-bottom: 0.05rem; }
      .visualizer-form .range-row { gap: 0.35rem; }
      .visualizer-form .range-value { min-width: 2.75rem; font-size: 0.8rem; }
      .auto-threshold-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
      .auto-threshold-row .btn { flex: 1; }
    </style>
  </head>
  <body>
    <div class="container-fluid px-0">
      <div class="card">
        <!-- Main view: threshold, gain, stats, Apply, Auto threshold -->
        <div id="main-view" class="popup-view active">
          <div class="card-header py-2">
            <div class="popup-header-inner">
              <span class="popup-title">Audio<br>Compressor</span>
              <img src="icons/icon128.png" alt="" class="popup-header-icon" width="64" height="64">
            </div>
          </div>
          <div class="card-body pt-2 pb-3">
            <form>
              <div class="form-group">
                <label for="threshold" title="Level in dB above which compression starts. Audio above this level is reduced in volume.">Threshold (dB)</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="threshold" min="-100" max="0" value="-24">
                  <span class="range-value" id="threshold-value">-24</span>
                </div>
              </div>
              <div class="form-group mb-0">
                <label for="gain" title="Output (makeup) gain. Boosts the compressed signal to compensate for reduced level.">Gain</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="gain" min="1" max="3" step="0.01" value="1">
                  <span class="range-value" id="gain-value">1</span>
                </div>
              </div>
              <div class="form-group mt-2 pt-2 border-top border-secondary stats-row">
                <div class="d-flex justify-content-between small text-muted">
                  <span>Input level:</span>
                  <span class="range-value font-weight-bold" id="input-level-value">— dB</span>
                </div>
                <div class="d-flex justify-content-between small text-muted mt-1">
                  <span>Gain reduction:</span>
                  <span class="range-value font-weight-bold" id="gain-reduction-value">— dB</span>
                </div>
              </div>
            </form>
            <div class="auto-threshold-row">
              <button type="button" class="btn btn-outline-secondary btn-sm" id="auto-3db" title="Measure input for 4s and set threshold for 3 dB gain reduction (light compression)">Light</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="auto-6db" title="Measure input for 4s and set threshold for 6 dB gain reduction (medium compression)">Medium</button>
              <button type="button" class="btn btn-outline-secondary btn-sm" id="auto-12db" title="Measure input for 4s and set threshold for 12 dB gain reduction (heavy compression)">Heavy</button>
            </div>
            <button type="button" class="btn btn-outline-danger btn-block btn-sm mt-2" id="stop-capture" title="Stop tab capture and all compression">Stop capture</button>
            <button type="button" class="btn btn-outline-secondary btn-block btn-sm mt-2" id="visualizer-btn" title="Settings and visualizer">Settings</button>
          </div>
        </div>
        <!-- Settings view: visualizer chart + all compressor settings -->
        <div id="visualizer-view" class="popup-view">
          <div class="card-header py-2">
            <span class="popup-title" style="font-size: 1.25rem;">Settings</span>
          </div>
          <div class="card-body pt-2 pb-3">
            <div class="visualizer-meters">
              <div class="viz-meter-row">
                <label><input type="checkbox" id="visualizer-gr-check" checked> <span>Gain reduction</span></label>
                <span class="viz-readout" id="visualizer-gr-db">— dB</span>
              </div>
              <div class="viz-meter-row">
                <label><input type="checkbox" id="visualizer-out-check"> <span>Output</span></label>
                <span class="viz-readout" id="visualizer-out-db">— dB</span>
              </div>
            </div>
            <div class="visualizer-chart-wrap">
              <canvas id="visualizer-canvas" width="304" height="160"></canvas>
            </div>
            <form id="visualizer-form" class="visualizer-form mt-2">
              <div class="form-group">
                <label for="viz-threshold" title="Level in dB above which compression starts.">Threshold (dB)</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="viz-threshold" min="-100" max="0" value="-24">
                  <span class="range-value" id="viz-threshold-value">-24</span>
                </div>
              </div>
              <div class="form-group">
                <label for="viz-ratio" title="Compression ratio.">Ratio</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="viz-ratio" min="2" max="20" value="18">
                  <span class="range-value" id="viz-ratio-value">18</span>
                </div>
              </div>
              <div class="form-group">
                <label for="viz-attack" title="Attack time in seconds.">Attack (s)</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="viz-attack" min="0.001" max="0.1" step="0.001" value="0.001">
                  <span class="range-value" id="viz-attack-value">0.001</span>
                </div>
              </div>
              <div class="form-group">
                <label for="viz-release" title="Release time in seconds.">Release (s)</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="viz-release" min="0.01" max="1" step="0.01" value="0.01">
                  <span class="range-value" id="viz-release-value">0.01</span>
                </div>
              </div>
              <div class="form-group mb-0">
                <label for="viz-gain" title="Output (makeup) gain.">Gain</label>
                <div class="range-row">
                  <input type="range" class="form-control-range" id="viz-gain" min="1" max="3" step="0.01" value="1">
                  <span class="range-value" id="viz-gain-value">1</span>
                </div>
              </div>
            </form>
            <button type="button" class="btn btn-primary btn-block btn-apply mt-3" id="visualizer-save" title="Save and return">Save</button>
          </div>
        </div>
      </div>
    </div>
    <script defer src="popup.js"></script>
  </body>
</html>
