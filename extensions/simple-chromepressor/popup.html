<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>SimpleChromepressor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&display=swap" rel="stylesheet">
    <style>
      body { min-width: 320px; margin: 0; background: lightgrey; }
      .card {
        border: none;
        box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, .08);
        background: lightgrey;
      }
      .card-header {
        color: black;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 1.6rem;
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1.1;
        border-bottom: 1px solid #000000;
        background: lightgrey;
      }
      .status {
        font-size: 1rem;
        color: #222;
        min-height: 2rem;
      }
      .btn-main {
        font-size: 1.2rem;
        font-weight: 700;
        padding: 0.95rem;
        border-radius: 0.6rem;
      }
      .btn-start {
        background: #363636;
        border-color: #363636;
        color: #fff;
      }
      .btn-start:hover,
      .btn-start:focus,
      .btn-start:active {
        background: #000000;
        border-color: #000000;
        color: #fff;
        box-shadow: none;
      }
      .btn-stop {
        background: #8b1f1f;
        border-color: #8b1f1f;
        color: #fff;
      }
      .btn-stop:hover,
      .btn-stop:focus,
      .btn-stop:active {
        background: #6f1414;
        border-color: #6f1414;
        color: #fff;
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid px-0">
      <div class="card">
        <div class="card-header py-3 px-3">Simple<br>Chromepressor</div>
        <div class="card-body p-3">
          <p id="status-text" class="status mb-3">Checking status...</p>
          <button id="toggle-compression" type="button" class="btn btn-main btn-start btn-block">
            Add Compression
          </button>
        </div>
      </div>
    </div>
    <script defer src="popup.js"></script>
  </body>
</html>
